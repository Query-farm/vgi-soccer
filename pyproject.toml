[project]
name = "vgi-soccer"
version = "0.1.0"
description = "A read-only VGI worker exposing world football standings, fixtures, match detail, and player statistics to Haybarn SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "soccer", "football", "premier league", "standings", "world cup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.50.0,<0.51",
    "httpx>=0.27,<1",
    "pyarrow>=18,<26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6,<8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://github.com/Query-farm/vgi-soccer#readme"
Repository = "https://github.com/Query-farm/vgi-soccer"
Issues = "https://github.com/Query-farm/vgi-soccer/issues"

[project.scripts]
vgi-soccer = "vgi_soccer.worker:main"
vgi-soccer-http = "vgi_soccer.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_soccer"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the public ESPN, openfootball, and OpenLigaDB endpoints"]
